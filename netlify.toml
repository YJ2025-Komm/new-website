[build]
  base = "client"
  command = "npm install && node scripts/generate-sitemap.js && npx tsx scripts/generate-changelog-feed.ts && npx vite build && npx puppeteer browsers install chrome && node scripts/prerender.mjs && node scripts/indexnow.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  PUPPETEER_CACHE_DIR = "/opt/build/cache/puppeteer"

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://new-website-r4rq.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/website-analysis"
  to = "/features"
  status = 301
  force = true
